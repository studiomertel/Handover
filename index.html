<title>Rückkehr-Übersicht</title>
<style>
:root{--bg:#B7BFBC;--ink:#1B2A41;--mute:#33342E;--line:#47607A;--acc:#3A431F;--acc-ink:#B7BFBC;--c2:#3A431F;--c2t:#B7BFBC;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#33342E;--ink:#B7BFBC;--mute:#A8ACA6;--line:#93958A;--acc:#94A37E;--acc-ink:#1B2A41;--c2:#94A37E;--c2t:#1B2A41;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#33342E;--ink:#B7BFBC;--mute:#A8ACA6;--line:#93958A;--acc:#94A37E;--acc-ink:#1B2A41;--c2:#94A37E;--c2t:#1B2A41;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:1.5rem;margin:0 0 14px;font-weight:650}
label.f{display:block;font-size:.85rem;color:var(--mute);margin-bottom:10px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:7px;padding:9px 10px;margin-top:4px}
textarea{min-height:96px;resize:vertical}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tools{display:flex;flex-direction:column;gap:10px;margin:6px 0 16px}
.tg{display:flex;align-items:center;gap:10px;font-size:.92rem;cursor:pointer}
.tg input{position:absolute;opacity:0;width:1px;height:1px}
.sw{flex:none;width:44px;height:24px;border:1px solid var(--line);border-radius:7px;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:5px;background:var(--ink);transition:transform .2s}
.tg input:checked+.sw{background:var(--acc)}
.tg input:checked+.sw::after{transform:translateX(20px);background:var(--acc-ink)}
.tg input:focus-visible+.sw,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.row{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.row:active{background:var(--acc);color:var(--acc-ink)}
.row p{margin:6px 0 0;font-size:.92rem;color:var(--mute);white-space:pre-wrap}
.row:active p{color:var(--acc-ink)}
.top{display:flex;justify-content:space-between;gap:8px}
.sub{display:flex;gap:10px;align-items:center;margin-top:6px;font-size:.85rem;color:var(--mute)}
.chip{border-radius:5px;padding:1px 8px;font-size:.8rem;background:#1B2A41;color:#B7BFBC}
.s1{background:#A8A594;color:#1B2A41}.s2{background:var(--c2);color:var(--c2t)}
.imp{font-size:.78rem;border:1px solid var(--ink);border-radius:5px;padding:0 6px;height:fit-content}
.mv{display:flex;gap:6px;margin-left:auto}
.mv button{font:inherit;width:44px;height:36px;border:1px solid var(--line);border-radius:7px;background:transparent;color:inherit;cursor:pointer}
.empty,#cnt,#bk{color:var(--mute);font-size:.9rem}
.r{animation:rise .45s both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.r{animation:none}.sw,.sw::after{transition:none}}
h2.k{font-size:1rem;margin:26px 0 10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;font-size:.92rem;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
.btn.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:14px 20px;font:inherit;font-weight:600;border:0;border-radius:10px;background:var(--acc);color:var(--acc-ink);box-shadow:0 2px 10px rgba(27,42,65,.35);cursor:pointer}
dialog{width:min(94vw,520px);border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:18px}
dialog::backdrop{background:rgba(27,42,65,.6)}
dialog .btns{margin-top:14px}
#rep{display:none}
@media print{body>*:not(#rep){display:none!important}#rep{display:block!important}:root{padding:0}}
</style>
<style id="rpcss">
.rp{background:#B7BFBC;color:#1B2A41;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:28px 18px;min-height:100vh;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rp>*{max-width:720px;margin-left:auto;margin-right:auto}
.rp h1{font-size:1.6rem;margin-top:0;margin-bottom:4px}
.rp h2{font-size:1.1rem;margin-top:26px;margin-bottom:10px;color:#33342E}
.rp .m{color:#33342E;margin-top:0;margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap}
.rp article{border:1px solid #47607A;border-radius:8px;padding:12px 14px;margin-bottom:10px;animation:rpr .5s both;animation-delay:calc(var(--i)*80ms)}
.rp h3{font-size:1rem;margin:0 0 4px}
.rp article p{margin:4px 0 0;white-space:pre-wrap}
.rp .c{background:#1B2A41;color:#B7BFBC;border-radius:5px;padding:0 7px;font-size:.8rem}
@keyframes rpr{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media print{.rp{background:#fff;padding:0;min-height:0}.rp article{animation:none;break-inside:avoid}}
@media (prefers-reduced-motion:reduce){.rp article{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<h1 class="r">Rückkehr-Übersicht</h1>
<div class="meta r" style="--i:1">
<label class="f">Abwesenheit<input id="zt" placeholder="02.11. – 13.11.2026"></label>
<label class="f">Vertretung<input id="vt" placeholder="Name"></label>
<label class="f" style="grid-column:1/-1">Einrichtung<input id="ei" placeholder="Name der Einrichtung"></label>
<label class="f" style="grid-column:1/-1">Kontakte (Objekt, Einrichtung, weitere Personen)<textarea id="ko" placeholder="z. B. Hausmeister Herr Müller, 0123 456789"></textarea></label>
</div>
<div class="tools r" style="--i:2">
<label class="tg"><input type="checkbox" id="fo"><span class="sw"></span>Für den Chef (ohne Erledigte)</label>
<label class="tg"><input type="checkbox" id="fw"><span class="sw"></span>Nur Wichtige</label>
<label class="f" style="margin:0">Sortierung<select id="so"><option value="st">Nach Status (Standard)</option><option value="alt">Chronologisch, älteste zuerst</option><option value="neu">Chronologisch, neueste zuerst</option><option value="man">Manuell (mit Pfeilen verschieben)</option></select></label>
</div>
<div id="list"></div>
<p id="cnt"></p>
<h2 class="k">Ausgabe und Backup</h2>
<div class="btns">
<button class="btn p" id="bh">Bericht als HTML</button>
<button class="btn p" id="bp">Bericht als PDF</button>
<button class="btn" id="bm">Als Markdown kopieren</button>
<button class="btn" id="bb">Backup speichern</button>
<button class="btn" id="bl">Backup laden</button>
</div>
<p id="bk"></p>
</div>
<button class="fab" id="add">+ Neuer Eintrag</button>
<dialog id="dlg">
<label class="tg" style="margin-bottom:10px"><input type="checkbox" id="hd"><span class="sw"></span>Mit Datum</label>
<label class="f" id="dw">Datum<input type="date" id="da"></label>
<label class="f">Kurztitel<input id="ti" placeholder="z. B. Techniker nicht erschienen"></label>
<label class="f">Status<select id="st"><option>Offen</option><option>In Klärung</option><option>Erledigt</option></select></label>
<label class="tg" style="margin-bottom:10px"><input type="checkbox" id="wi"><span class="sw"></span>Wichtig</label>
<label class="f">Kontakt zu diesem Eintrag (optional)<input id="kt" placeholder="z. B. Firma XY, Herr Beispiel, 0123 456789"></label>
<label class="f">Details (später nachtragbar)<textarea id="de"></textarea></label>
<div class="btns">
<button class="btn p" id="ok">Speichern</button>
<button class="btn" id="no">Abbrechen</button>
<button class="btn" id="del" style="grid-column:1/-1">Eintrag löschen</button>
</div>
</dialog>
<div id="rep"></div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
const K="rueckkehr-v1",$=s=>document.querySelector(s),ST=["Offen","In Klärung","Erledigt"];
let S={meta:{zt:"",vt:"",ei:"",ko:"",so:"st",bk:""},items:[]},cur=null;
try{const r=JSON.parse(localStorage.getItem(K));if(r&&Array.isArray(r.items))S={meta:Object.assign(S.meta,r.meta),items:r.items}}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
try{navigator.serviceWorker&&navigator.serviceWorker.register("sw.js")}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert("Speichern nicht möglich. Bitte sofort ein Backup sichern.")}};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=d=>d?d.split("-").reverse().join("."):"";
const today=()=>{const t=new Date();return new Date(t-t.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const rank0=(a,b)=>ST.indexOf(a.status)-ST.indexOf(b.status)||(b.wichtig?1:0)-(a.wichtig?1:0)||(b.datum||"").localeCompare(a.datum||"");
const rank=(a,b)=>S.meta.so==="man"?0:S.meta.so==="alt"?(a.datum||"").localeCompare(b.datum||""):S.meta.so==="neu"?(b.datum||"").localeCompare(a.datum||""):rank0(a,b);
const und=a=>S.meta.so==="man"?a:a.sort((x,y)=>(!y.datum)-(!x.datum));
let VIS=[];
function mv(id,d){const k=VIS.findIndex(x=>x.id===id),nb=VIS[k+d];if(!nb)return;const a=S.items.indexOf(VIS[k]),b=S.items.indexOf(nb);[S.items[a],S.items[b]]=[S.items[b],S.items[a]];save();render()}
function render(){
const v=S.items.filter(i=>!($("#fo").checked&&i.status==="Erledigt")&&!($("#fw").checked&&!i.wichtig)).sort(rank);und(v);
const man=S.meta.so==="man",both=!man&&v.some(x=>!x.datum)&&v.some(x=>x.datum);$("#list").innerHTML=v.length?v.map((i,n)=>`${both&&(n===0||!v[n-1].datum!==!i.datum)?`<h2 class="k">${i.datum?"Mit Datum":"Allgemeine Infos"}</h2>`:""}<div class="row r" data-id="${i.id}" style="--i:${Math.min(n,8)}"><div class="top"><b>${esc(i.titel)}</b>${i.wichtig?'<span class="imp">Wichtig</span>':""}${man?`<span class="mv"><button data-mv="${i.id}" data-d="-1" aria-label="nach oben">▲</button><button data-mv="${i.id}" data-d="1" aria-label="nach unten">▼</button></span>`:""}</div><div class="sub"><span class="chip s${ST.indexOf(i.status)}">${i.status}</span>${i.datum?`<span>${fd(i.datum)}</span>`:""}</div>${i.details?`<p>${esc(i.details)}</p>`:""}${i.kontakt?`<p>Kontakt: ${esc(i.kontakt)}</p>`:""}</div>`).join(""):`<p class="empty">Noch keine Einträge. Tippe auf „Neuer Eintrag“.</p>`;
VIS=v;$("#cnt").textContent=`${v.length} von ${S.items.length} Einträgen`;
const b=S.meta.bk;$("#bk").textContent=b?`Letztes Backup: ${fd(b)}${(Date.now()-new Date(b))/864e5>7?" (älter als 7 Tage, bitte erneuern)":""}`:"Noch kein Backup gespeichert. Bitte regelmäßig sichern.";
}
const dw=()=>{$("#dw").style.display=$("#hd").checked?"":"none"};
$("#hd").onchange=()=>{dw();if($("#hd").checked&&!$("#da").value)$("#da").value=today()};
function openD(id){cur=id;const i=S.items.find(x=>x.id===id)||{datum:"",titel:"",status:"Offen",wichtig:false,details:""};
$("#hd").checked=!!i.datum;$("#da").value=i.datum||today();dw();$("#ti").value=i.titel;$("#st").value=i.status;$("#wi").checked=!!i.wichtig;$("#de").value=i.details||"";$("#kt").value=i.kontakt||"";$("#del").hidden=!id;$("#dlg").showModal()}
$("#add").onclick=()=>openD(null);
$("#list").onclick=e=>{const m=e.target.closest("[data-mv]");if(m){mv(m.dataset.mv,+m.dataset.d);return}const r=e.target.closest(".row");if(r)openD(r.dataset.id)};
$("#no").onclick=()=>$("#dlg").close();
$("#ok").onclick=()=>{const t=$("#ti").value.trim();if(!t){$("#ti").focus();return}
const o={datum:$("#hd").checked?($("#da").value||today()):"",titel:t,status:$("#st").value,wichtig:$("#wi").checked,details:$("#de").value.trim(),kontakt:$("#kt").value.trim()};
if(cur)Object.assign(S.items.find(x=>x.id===cur),o);else S.items.push(Object.assign({id:Date.now().toString(36)},o));
save();render();$("#dlg").close()};
$("#del").onclick=()=>{if(confirm("Eintrag löschen?")){S.items=S.items.filter(x=>x.id!==cur);save();render();$("#dlg").close()}};
$("#fo").onchange=$("#fw").onchange=render;
$("#zt").oninput=e=>{S.meta.zt=e.target.value;save()};
$("#vt").oninput=e=>{S.meta.vt=e.target.value;save()};
$("#ei").oninput=e=>{S.meta.ei=e.target.value;save()};
$("#ko").oninput=e=>{S.meta.ko=e.target.value;save()};
$("#so").onchange=e=>{S.meta.so=e.target.value;save();render()};
const fill=()=>{$("#zt").value=S.meta.zt;$("#vt").value=S.meta.vt;$("#ei").value=S.meta.ei;$("#ko").value=S.meta.ko;$("#so").value=S.meta.so};fill();
function rep(){
const act=und(S.items.filter(i=>i.status!=="Erledigt").sort(rank)),imp=act.filter(i=>i.wichtig),rest=act.filter(i=>!i.wichtig),done=und(S.items.filter(i=>i.status==="Erledigt").sort(rank));
const sec=(t,a)=>a.length?`<h2>${t}</h2>`+a.map((i,n)=>`<article style="--i:${n}"><h3>${esc(i.titel)}</h3><p class="m">${i.datum?`<span>${fd(i.datum)}</span>`:""}<span class="c">${i.status}</span></p>${i.details?`<p>${esc(i.details)}</p>`:""}${i.kontakt?`<p>Kontakt: ${esc(i.kontakt)}</p>`:""}</article>`).join(""):"";
const md=(t,a)=>a.length?`\n## ${t}\n`+a.map(i=>`- **${i.titel}** (${[i.datum&&fd(i.datum),i.status].filter(Boolean).join(", ")})${i.details?": "+i.details.replace(/\n/g," "):""}${i.kontakt?" (Kontakt: "+i.kontakt+")":""}`).join("\n")+"\n":"";
const head=[S.meta.ei&&"Einrichtung: "+S.meta.ei,S.meta.zt&&"Abwesenheit: "+S.meta.zt,S.meta.vt&&"Vertretung: "+S.meta.vt].filter(Boolean);
return{html:`<h1>Rückkehr-Übersicht</h1><p class="m">${head.map(esc).join(" | ")}</p>`+(S.meta.ko?`<h2>Kontakte</h2><article style="--i:0"><p>${esc(S.meta.ko)}</p></article>`:"")+(S.items.length?sec("Das Wichtigste",imp)+sec("Offen und in Klärung",rest)+sec("Erledigt",done):"<p>Keine Einträge.</p>"),
md:`# Rückkehr-Übersicht\n\n${head.join("  \n")}\n`+(S.meta.ko?`\n## Kontakte\n${S.meta.ko}\n`:"")+md("Das Wichtigste",imp)+md("Offen und in Klärung",rest)+md("Erledigt",done)}}
async function out(name,txt,type){const f=new File([txt],name,{type});
try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e.name==="AbortError")return}
const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$("#bh").onclick=()=>out(`Rueckkehr-Uebersicht-${today()}.html`,`<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rückkehr-Übersicht</title><style>body{margin:0}${$("#rpcss").textContent}</style></head><body><div class="rp">${rep().html}</div></body></html>`,"text/html");
function pdf(){
const W=595,H=842,M=56,CW=W-2*M,WM={"€":128,"„":132,"…":133,"‘":145,"’":146,"“":147,"”":148,"•":149,"–":150,"—":151};
const enc=s=>[...String(s)].map(c=>{const k=c.charCodeAt(0);return WM[c]?String.fromCharCode(WM[c]):(k>=32&&k<256&&!(k>126&&k<160))?c:" "}).join("");
const pe=s=>enc(s).replace(/[\\()]/g,"\\$&");
let pg=[],cu=[],y=H-M;
const nl=()=>{pg.push(cu.join("\n"));cu=[];y=H-M};
const wrap=(t,sz)=>{const n=Math.floor(CW/(sz*.55)),o=[];String(t).split("\n").forEach(p=>{let l="";p.split(" ").forEach(w=>{while(w.length>n){if(l){o.push(l);l=""}o.push(w.slice(0,n));w=w.slice(n)}if((l+" "+w).trim().length>n){o.push(l);l=w}else l=(l+" "+w).trim()});o.push(l)});return o};
const ln=(t,sz,b,gap,col)=>{wrap(t,sz).forEach(x=>{if(y-sz<M)nl();cu.push(`BT /F${b?2:1} ${sz} Tf ${col||"0.106 0.165 0.255"} rg ${M} ${y-sz} Td (${pe(x)}) Tj ET`);y-=sz*1.25});y-=gap};
const act=und(S.items.filter(i=>i.status!=="Erledigt").sort(rank)),imp=act.filter(i=>i.wichtig),rest=act.filter(i=>!i.wichtig),done=und(S.items.filter(i=>i.status==="Erledigt").sort(rank));
ln("Rückkehr-Übersicht",20,1,4);
[S.meta.ei&&"Einrichtung: "+S.meta.ei,S.meta.zt&&"Abwesenheit: "+S.meta.zt,S.meta.vt&&"Vertretung: "+S.meta.vt].filter(Boolean).forEach(t=>ln(t,11,0,0,"0.2 0.2 0.18"));
y-=10;if(S.meta.ko){ln("Kontakte",14,1,6);ln(S.meta.ko,11,0,0);y-=14}
const sec=(t,a)=>{if(!a.length)return;ln(t,14,1,6);a.forEach(i=>{ln(i.titel,12,1,1);ln([i.datum&&fd(i.datum),i.status,i.wichtig&&"Wichtig"].filter(Boolean).join("  |  "),10,0,2,"0.2 0.2 0.18");if(i.details)ln(i.details,11,0,0);if(i.kontakt)ln("Kontakt: "+i.kontakt,10,0,0,"0.2 0.2 0.18");y-=10});y-=4};
if(S.items.length){sec("Das Wichtigste",imp);sec("Offen und in Klärung",rest);sec("Erledigt",done)}else ln("Keine Einträge.",11,0,0);
nl();
const N=4+pg.length*2,ob=[];
ob[1]="<</Type/Catalog/Pages 2 0 R>>";
ob[2]=`<</Type/Pages/Kids [${pg.map((_,i)=>`${5+2*i} 0 R`).join(" ")}]/Count ${pg.length}>>`;
ob[3]="<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>";
