<title>Rückkehr-Übersicht</title>
<style>
:root{--bg:#B7BFBC;--ink:#1B2A41;--mute:#33342E;--line:#47607A;--acc:#3A431F;--acc-ink:#B7BFBC;--c2:#3A431F;--c2t:#B7BFBC;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#33342E;--ink:#B7BFBC;--mute:#A8ACA6;--line:#93958A;--acc:#94A37E;--acc-ink:#1B2A41;--c2:#94A37E;--c2t:#1B2A41;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#33342E;--ink:#B7BFBC;--mute:#A8ACA6;--line:#93958A;--acc:#94A37E;--acc-ink:#1B2A41;--c2:#94A37E;--c2t:#1B2A41;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:1.5rem;margin:0 0 14px;font-weight:650}
label.f{display:block;font-size:.85rem;color:var(--mute);margin-bottom:10px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:7px;padding:9px 10px;margin-top:4px}
textarea{min-height:96px;resize:vertical}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tools{display:flex;flex-direction:column;gap:10px;margin:6px 0 16px}
.tg{display:flex;align-items:center;gap:10px;font-size:.92rem;cursor:pointer}
.tg input{position:absolute;opacity:0;width:1px;height:1px}
.sw{flex:none;width:44px;height:24px;border:1px solid var(--line);border-radius:7px;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:5px;background:var(--ink);transition:transform .2s}
.tg input:checked+.sw{background:var(--acc)}
.tg input:checked+.sw::after{transform:translateX(20px);background:var(--acc-ink)}
.tg input:focus-visible+.sw,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.row{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.row:active{background:var(--acc);color:var(--acc-ink)}
.row p{margin:6px 0 0;font-size:.92rem;color:var(--mute);white-space:pre-wrap}
.row:active p{color:var(--acc-ink)}
.top{display:flex;justify-content:space-between;gap:8px}
.sub{display:flex;gap:10px;align-items:center;margin-top:6px;font-size:.85rem;color:var(--mute)}
.chip{display:inline-block;min-width:6.6em;text-align:center;border:1px solid var(--ink);border-radius:5px;padding:1px 8px;font-size:.8rem;color:var(--ink)}
.chip.s1{border-color:transparent;background:#A8A594;color:#1B2A41}.chip.s2{border-color:transparent;background:#7C93A0;color:#1B2A41}.chip.s3{border-color:transparent;background:#A8ACA6;color:#45473E}
@media (prefers-color-scheme:dark){.chip.s1{background:#5C6E3C;color:#B7BFBC}.chip.s2{background:#47607A;color:#B7BFBC}.chip.s3{background:#45473E;color:#A8ACA6}}
.imp{font-size:.78rem;font-weight:700;background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:5px;padding:0 7px;height:fit-content}
.mv{display:flex;gap:6px;margin-left:auto}
.mv button{font:inherit;width:44px;height:36px;border:1px solid var(--line);border-radius:7px;background:transparent;color:inherit;cursor:pointer}
.empty,#cnt,#bk{color:var(--mute);font-size:.9rem}
.r{animation:rise .45s both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.r{animation:none}.sw,.sw::after{transition:none}}
h2.k{font-size:1rem;margin:26px 0 10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;font-size:.92rem;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
.btn.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:14px 20px;font:inherit;font-weight:600;border:0;border-radius:10px;background:var(--acc);color:var(--acc-ink);box-shadow:0 2px 10px rgba(27,42,65,.35);cursor:pointer}
dialog{width:min(94vw,520px);border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:18px}
dialog::backdrop{background:rgba(27,42,65,.6)}
dialog .btns{margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
<h1 class="r">Rückkehr-Übersicht</h1>
<div class="meta r" style="--i:1">
<label class="f">Abwesenheit<input id="zt" placeholder="02.11. – 13.11.2026"></label>
<label class="f">Vertretung<input id="vt" placeholder="Name"></label>
<label class="f" style="grid-column:1/-1">Einrichtung<input id="ei" placeholder="Name der Einrichtung"></label>
<label class="f" style="grid-column:1/-1">Kontakte (Objekt, Einrichtung, weitere Personen)<textarea id="ko" placeholder="z. B. Hausmeister Herr Müller, 0123 456789"></textarea></label>
<label class="f" style="grid-column:1/-1">Branding (erscheint unten im Bericht)<textarea id="br" placeholder="z. B. Firmenname, Adresse, Telefon, Hinweis"></textarea></label>
</div>
<div class="tools r" style="--i:2">
<label class="tg"><input type="checkbox" id="fo"><span class="sw"></span>Für den Chef (ohne Erledigte)</label>
<label class="tg"><input type="checkbox" id="fw"><span class="sw"></span>Nur Wichtige</label>
<label class="f" style="margin:0">Sortierung<select id="so"><option value="st">Nach Status (Standard)</option><option value="alt">Chronologisch, älteste zuerst</option><option value="neu">Chronologisch, neueste zuerst</option><option value="man">Manuell (mit Pfeilen verschieben)</option></select></label>
</div>
<div id="list"></div>
<p id="cnt"></p>
<h2 class="k">Ausgabe und Backup</h2>
<label class="f">Berichtstitel (vor dem Absenden anpassbar)<input id="bt" placeholder="Rückkehr-Übersicht"></label>
<div class="btns">
<button class="btn p" id="bh">Bericht statisch (HTML)</button>
<button class="btn p" id="bi">Bericht interaktiv (HTML)</button>
<button class="btn p" id="bp">Bericht als PDF</button>
<button class="btn" id="bm">Als Markdown kopieren</button>
<button class="btn" id="bb">Backup speichern</button>
<button class="btn" id="bl">Backup laden</button>
</div>
<p id="bk"></p>
<p style="margin-top:4px;font-size:.8rem;color:var(--mute)">Version 8 (Berichtstitel, einklappbare Suche und Filter)</p>
</div>
<button class="fab" id="add">+ Neuer Eintrag</button>
<dialog id="dlg">
<label class="f">Datum<input type="date" id="da"></label>
<label class="f">Kurztitel<input id="ti" placeholder="z. B. Techniker nicht erschienen"></label>
<label class="f">Status<select id="st"><option>Offen</option><option>In Klärung</option><option>Info</option><option>Erledigt</option></select></label>
<label class="tg" style="margin-bottom:10px"><input type="checkbox" id="wi"><span class="sw"></span>Wichtig</label>
<label class="f">Kontakt zu diesem Eintrag (optional)<input id="kt" placeholder="z. B. Firma XY, Herr Beispiel, 0123 456789"></label>
<label class="f">Details (später nachtragbar)<textarea id="de"></textarea></label>
<div class="btns">
<button class="btn p" id="ok">Speichern</button>
<button class="btn" id="no">Abbrechen</button>
<button class="btn" id="del" style="grid-column:1/-1">Eintrag löschen</button>
</div>
</dialog>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
const K="rueckkehr-v1",$=s=>document.querySelector(s),ST=["Offen","In Klärung","Info","Erledigt"];
let S={meta:{zt:"",vt:"",ei:"",ko:"",br:"",ti:"",so:"st",bk:""},items:[]},cur=null;
try{const r=JSON.parse(localStorage.getItem(K));if(r&&Array.isArray(r.items))S={meta:Object.assign(S.meta,r.meta),items:r.items}}catch(e){}
S.items.forEach(i=>{if(!ST.includes(i.status))i.status="Info";if(i.datum==null)i.datum=""});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
try{navigator.serviceWorker&&navigator.serviceWorker.register("sw.js")}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert("Speichern nicht möglich. Bitte sofort ein Backup sichern.")}};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=d=>d?d.split("-").reverse().join("."):"";
const today=()=>{const t=new Date();return new Date(t-t.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const TT=()=>(S.meta.ti||"").trim()||"Rückkehr-Übersicht";
const rank0=(a,b)=>ST.indexOf(a.status)-ST.indexOf(b.status)||(b.wichtig?1:0)-(a.wichtig?1:0)||b.datum.localeCompare(a.datum);
const rank=(a,b)=>S.meta.so==="man"?0:S.meta.so==="alt"?a.datum.localeCompare(b.datum):S.meta.so==="neu"?b.datum.localeCompare(a.datum):rank0(a,b);
let VIS=[];
function mv(id,d){const k=VIS.findIndex(x=>x.id===id),nb=VIS[k+d];if(!nb)return;const a=S.items.indexOf(VIS[k]),b=S.items.indexOf(nb);[S.items[a],S.items[b]]=[S.items[b],S.items[a]];save();render()}
function render(){
const v=S.items.filter(i=>!($("#fo").checked&&i.status==="Erledigt")&&!($("#fw").checked&&!i.wichtig)).sort(rank);
const man=S.meta.so==="man";$("#list").innerHTML=v.length?v.map((i,n)=>`<div class="row r" data-id="${i.id}" style="--i:${Math.min(n,8)}"><div class="top"><b>${esc(i.titel)}</b>${i.wichtig?'<span class="imp">Wichtig</span>':""}${man?`<span class="mv"><button data-mv="${i.id}" data-d="-1" aria-label="nach oben">▲</button><button data-mv="${i.id}" data-d="1" aria-label="nach unten">▼</button></span>`:""}</div><div class="sub"><span class="chip s${ST.indexOf(i.status)}">${i.status}</span><span>${fd(i.datum)}</span></div>${i.details?`<p>${esc(i.details)}</p>`:""}${i.kontakt?`<p>Kontakt: ${esc(i.kontakt)}</p>`:""}</div>`).join(""):`<p class="empty">Noch keine Einträge. Tippe auf „Neuer Eintrag“.</p>`;
VIS=v;$("#cnt").textContent=`${v.length} von ${S.items.length} Einträgen`;
const b=S.meta.bk;$("#bk").textContent=b?`Letztes Backup: ${fd(b)}${(Date.now()-new Date(b))/864e5>7?" (älter als 7 Tage, bitte erneuern)":""}`:"Noch kein Backup gespeichert. Bitte regelmäßig sichern.";
}
function openD(id){cur=id;const i=S.items.find(x=>x.id===id)||{datum:today(),titel:"",status:"Offen",wichtig:false,details:""};
$("#da").value=i.datum;$("#ti").value=i.titel;$("#st").value=i.status;$("#wi").checked=!!i.wichtig;$("#de").value=i.details||"";$("#kt").value=i.kontakt||"";$("#del").hidden=!id;$("#dlg").showModal()}
$("#add").onclick=()=>openD(null);
$("#list").onclick=e=>{const m=e.target.closest("[data-mv]");if(m){mv(m.dataset.mv,+m.dataset.d);return}const r=e.target.closest(".row");if(r)openD(r.dataset.id)};
$("#no").onclick=()=>$("#dlg").close();
$("#ok").onclick=()=>{const t=$("#ti").value.trim();if(!t){$("#ti").focus();return}
const o={datum:$("#da").value||today(),titel:t,status:$("#st").value,wichtig:$("#wi").checked,details:$("#de").value.trim(),kontakt:$("#kt").value.trim()};
if(cur)Object.assign(S.items.find(x=>x.id===cur),o);else S.items.push(Object.assign({id:Date.now().toString(36)},o));
save();render();$("#dlg").close()};
$("#del").onclick=()=>{if(confirm("Eintrag löschen?")){S.items=S.items.filter(x=>x.id!==cur);save();render();$("#dlg").close()}};
$("#fo").onchange=$("#fw").onchange=render;
$("#zt").oninput=e=>{S.meta.zt=e.target.value;save()};
$("#vt").oninput=e=>{S.meta.vt=e.target.value;save()};
$("#ei").oninput=e=>{S.meta.ei=e.target.value;save()};
$("#ko").oninput=e=>{S.meta.ko=e.target.value;save()};
$("#br").oninput=e=>{S.meta.br=e.target.value;save()};
$("#bt").oninput=e=>{S.meta.ti=e.target.value;save()};
$("#so").onchange=e=>{S.meta.so=e.target.value;save();render()};
const fill=()=>{$("#zt").value=S.meta.zt;$("#vt").value=S.meta.vt;$("#ei").value=S.meta.ei;$("#ko").value=S.meta.ko;$("#br").value=S.meta.br||"";$("#bt").value=S.meta.ti||"";$("#so").value=S.meta.so};fill();
function rep(){
const act=S.items.filter(i=>i.status!=="Erledigt").sort(rank),imp=act.filter(i=>i.wichtig),rest=act.filter(i=>!i.wichtig),done=S.items.filter(i=>i.status==="Erledigt").sort(rank);
const md=(t,a)=>a.length?`\n## ${t}\n`+a.map(i=>`- **${i.titel}** (${i.status}, ${fd(i.datum)})${i.details?": "+i.details.replace(/\n/g," "):""}${i.kontakt?" (Kontakt: "+i.kontakt+")":""}`).join("\n")+"\n":"";
const head=[S.meta.ei&&"Einrichtung: "+S.meta.ei,S.meta.zt&&"Abwesenheit: "+S.meta.zt,S.meta.vt&&"Vertretung: "+S.meta.vt].filter(Boolean);
return{md:`# ${TT()}\n\n${head.join("  \n")}\n`+(S.meta.ko?`\n## Kontakte\n${S.meta.ko}\n`:"")+md("Das Wichtigste",imp)+md("Offen, in Klärung und Info",rest)+md("Erledigt",done)+(S.meta.br?"\n---\n"+S.meta.br+"\n":"")}}
async function out(name,txt,type){const f=new File([txt],name,{type});
try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e.name==="AbortError")return}
const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function pdf(){
const W=595,H=842,M=56,CW=W-2*M,WM={"€":128,"„":132,"…":133,"‘":145,"’":146,"“":147,"”":148,"•":149,"–":150,"—":151};
const enc=s=>[...String(s)].map(c=>{const k=c.charCodeAt(0);return WM[c]?String.fromCharCode(WM[c]):(k>=32&&k<256&&!(k>126&&k<160))?c:" "}).join("");
const pe=s=>enc(s).replace(/[\\()]/g,"\\$&");
let pg=[],cu=[],y=H-M;
const nl=()=>{pg.push(cu.join("\n"));cu=[];y=H-M};
const wrap=(t,sz)=>{const n=Math.floor(CW/(sz*.55)),o=[];String(t).split("\n").forEach(p=>{let l="";p.split(" ").forEach(w=>{while(w.length>n){if(l){o.push(l);l=""}o.push(w.slice(0,n));w=w.slice(n)}if((l+" "+w).trim().length>n){o.push(l);l=w}else l=(l+" "+w).trim()});o.push(l)});return o};
const ln=(t,sz,b,gap,col)=>{wrap(t,sz).forEach(x=>{if(y-sz<M)nl();cu.push(`BT /F${b?2:1} ${sz} Tf ${col||"0.106 0.165 0.255"} rg ${M} ${y-sz} Td (${pe(x)}) Tj ET`);y-=sz*1.25});y-=gap};
const act=S.items.filter(i=>i.status!=="Erledigt").sort(rank),imp=act.filter(i=>i.wichtig),rest=act.filter(i=>!i.wichtig),done=S.items.filter(i=>i.status==="Erledigt").sort(rank);
ln(TT(),20,1,4);
[S.meta.ei&&"Einrichtung: "+S.meta.ei,S.meta.zt&&"Abwesenheit: "+S.meta.zt,S.meta.vt&&"Vertretung: "+S.meta.vt].filter(Boolean).forEach(t=>ln(t,11,0,0,"0.2 0.2 0.18"));
y-=10;if(S.meta.ko){ln("Kontakte",14,1,6);ln(S.meta.ko,11,0,0);y-=14}
const sec=(t,a)=>{if(!a.length)return;ln(t,14,1,6);a.forEach(i=>{ln(i.titel,12,1,1);ln(`${i.status}${i.wichtig?"  |  Wichtig":""}  |  ${fd(i.datum)}`,10,0,2,"0.2 0.2 0.18");if(i.details)ln(i.details,11,0,0);if(i.kontakt)ln("Kontakt: "+i.kontakt,10,0,0,"0.2 0.2 0.18");y-=10});y-=4};
if(S.items.length){sec("Das Wichtigste",imp);sec("Offen, in Klärung und Info",rest);sec("Erledigt",done)}else ln("Keine Einträge.",11,0,0);
if(S.meta.br){y-=10;ln(S.meta.br,10,0,0,"0.2 0.2 0.18")}
nl();
const N=4+pg.length*2,ob=[];
ob[1]="<</Type/Catalog/Pages 2 0 R>>";
ob[2]=`<</Type/Pages/Kids [${pg.map((_,i)=>`${5+2*i} 0 R`).join(" ")}]/Count ${pg.length}>>`;
ob[3]="<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>";
ob[4]="<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>";
pg.forEach((c,i)=>{ob[5+2*i]=`<</Type/Page/Parent 2 0 R/MediaBox [0 0 ${W} ${H}]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>>>/Contents ${6+2*i} 0 R>>`;ob[6+2*i]=`<</Length ${c.length}>>\nstream\n${c}\nendstream`});
let o="%PDF-1.4\n",off=[];
for(let k=1;k<=N;k++){off[k]=o.length;o+=`${k} 0 obj\n${ob[k]}\nendobj\n`}
const xr=o.length;
o+=`xref\n0 ${N+1}\n0000000000 65535 f \n`+off.slice(1).map(v=>String(v).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<</Size ${N+1}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`;
return Uint8Array.from(o,c=>c.charCodeAt(0)&255)}
const IVL="--bg:#B7BFBC;--ink:#1B2A41;--mute:#45473E;--line:#93958A;--acc:#3A431F;--ai:#B7BFBC;--c1:#A8A594;--c1t:#1B2A41;--c2:#A8ACA6;--c2t:#45473E;--ci:#7C93A0;--cit:#1B2A41;--w:#1B2A41;--wt:#B7BFBC";
const IVD="--bg:#33342E;--ink:#B7BFBC;--mute:#A8ACA6;--line:#45473E;--acc:#94A37E;--ai:#1B2A41;--c1:#5C6E3C;--c1t:#B7BFBC;--c2:#45473E;--c2t:#A8ACA6;--ci:#47607A;--cit:#B7BFBC;--w:#B7BFBC;--wt:#1B2A41";
const IVCSS=`:root{${IVL};color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){${IVD};color-scheme:dark}}
:root[data-theme="dark"]{${IVD};color-scheme:dark}
*{box-sizing:border-box}html{font-size:clamp(16px,calc(12px + .4vw),20px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.w{max-width:56em;margin:0 auto;padding:1.5em 1em 4em}
h1{font-size:1.5em;margin:0 0 4px;font-weight:650}
h2{font-size:.78em;margin:26px 0 10px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.m{color:var(--mute);margin:0 0 6px;font-size:.92em}
.ctl{display:none;margin:16px 0;border:1px solid var(--line);border-radius:8px}
.js .ctl{display:block}
.ctl label.f{font-size:.82em;color:var(--mute)}
input[type=search],input[type=date],select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1px solid var(--mute);border-radius:7px;padding:9px 10px;margin-top:4px;min-height:44px}
input[type=range]{width:100%;accent-color:var(--acc)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tg{display:flex;align-items:center;gap:10px;font-size:.9em;cursor:pointer}
.tg input{position:absolute;opacity:0;width:1px;height:1px}
.sw{flex:none;width:44px;height:24px;border:1px solid var(--mute);border-radius:7px;position:relative}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:5px;background:var(--mute);transition:transform .2s}
.tg input:checked+.sw{background:var(--acc);border-color:var(--acc)}
.tg input:checked+.sw::after{transform:translateX(20px);background:var(--ai)}
.tg input:focus-visible+.sw,button:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button{font:inherit;font-size:.9em;padding:9px 12px;min-height:44px;border:1px solid var(--mute);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
#cn{color:var(--mute);font-size:.85em;margin:8px 0 0}
.fb{display:none;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.js .fb{display:flex}
.js .sm{display:none}
.fb button{display:inline-flex;gap:.5em;align-items:center;padding:8px 14px}
.fb button span{font-variant-numeric:tabular-nums;opacity:.8}
.fb button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--ai)}
.fb button.w{border:2px solid var(--w);font-weight:700}
.fb button.w[aria-pressed=true]{background:var(--w);border-color:var(--w);color:var(--wt)}
details.it,details.kb{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;animation:rise .4s both;animation-delay:calc(var(--i,0)*50ms)}
details.it.imp{border-left:6px solid var(--w);background:color-mix(in srgb,var(--w) 8%,transparent)}
details.kb{margin:10px 0}
summary{cursor:pointer;list-style:none;position:relative;padding:12px 48px 12px 14px;display:grid;grid-template-columns:6.6em 4.6em 1fr;gap:6px 10px;align-items:center}
details.kb>summary{display:block}
summary::-webkit-details-marker{display:none}
summary:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
summary::after{content:"+";position:absolute;right:14px;top:12px;width:1.55em;height:1.55em;font-size:.9em;display:flex;align-items:center;justify-content:center;border:1px solid var(--mute);border-radius:7px;font-weight:700;line-height:1;color:var(--ink)}
details[open]>summary::after{content:"\\2212"}
summary:hover::after{background:var(--acc);border-color:var(--acc);color:var(--ai)}
.ctl>summary,details.kb>summary{display:block;font-weight:600}
.ctl>summary::after,details.kb>summary::after{top:50%;transform:translateY(-50%)}
.cb{display:flex;flex-direction:column;gap:12px;padding:0 14px 14px}
details[open]>.cb,details[open]>.bd{animation:fade .25s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (min-width:900px){.cb{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}.cb>label.f:first-child,.cb>.g:last-child{grid-column:1/-1}}
.t{grid-column:1/-1;font-weight:600}
.c{display:block;text-align:center;border:1px solid var(--ink);border-radius:5px;padding:0 6px;font-size:.78em;line-height:1.7}
.c.s1{border-color:transparent;background:var(--c1);color:var(--c1t)}
.c.s2{border-color:transparent;background:var(--ci);color:var(--cit)}
.c.s3{border-color:transparent;background:var(--c2);color:var(--c2t)}
.wi{font-size:.74em;font-weight:700;letter-spacing:.03em;line-height:1.7;text-align:center;border-radius:5px;background:var(--w);color:var(--wt)}
.wi:empty{background:none}
.d{font-size:.85em;color:var(--mute);font-variant-numeric:tabular-nums}
.bd{padding:0 14px 12px}.bd p{margin:4px 0 0;white-space:pre-wrap;font-size:.95em}
.empty{color:var(--mute)}
.ft{margin:32px 0 0;padding-top:12px;border-top:1px solid var(--line);color:var(--mute);font-size:.85em;white-space:pre-wrap}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){details.it,details.kb,details[open]>.cb,details[open]>.bd{animation:none}.sw::after{transition:none}}
@media print{.ctl,.fb{display:none!important}body{background:#fff;color:#000}details.it,details.kb{break-inside:avoid;animation:none}}`;
const ivBody=(r,ia)=>`<div class="w"><h1>${r.title}</h1><p class="m" id="hd">${r.head}</p><p class="m sm">${r.sum}</p><div id="kb">${r.kb}</div>
`+(ia?`<div class="fb" id="fb" role="group" aria-label="Schnellfilter"></div><details class="ctl" id="cp"><summary>Suche und Filter</summary><div class="cb"><label class="f">Suche (Titel, Details, Kontakte, Datum)<input type="search" id="q" placeholder="Suchbegriff eingeben"></label>
<div class="g"><label class="f">Sortierung<select id="so"><option value="st">Nach Status</option><option value="alt">Älteste zuerst</option><option value="neu">Neueste zuerst</option></select></label></div>
<div class="g"><label class="f">Datum von<input type="date" id="dv"></label><label class="f">Datum bis<input type="date" id="db"></label></div>
<label class="f">Schriftgröße<input type="range" id="fz" min="14" max="24" step="1" value="16"></label>
<label class="tg"><input type="checkbox" id="th"><span class="sw"></span>Dunkle Ansicht</label>
<div class="g"><button id="ex">Alle aufklappen</button><button id="rs">Zurücksetzen</button></div></div></details>`:`<p class="d">Tippe auf einen Eintrag, um die Details zu sehen.</p>`)+`<p id="cn">${r.cn}</p><div id="ls">${r.list}</div>${r.foot?`<p class="ft">${r.foot}</p>`:""}</div>`;
function ivHtml(D,f){
const ST=["Offen","In Klärung","Info","Erledigt"];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=d=>d?d.split("-").reverse().join("."):"";
const head=[D.meta.ei&&"Einrichtung: "+D.meta.ei,D.meta.zt&&"Abwesenheit: "+D.meta.zt,D.meta.vt&&"Vertretung: "+D.meta.vt].filter(Boolean).map(esc).join(" | ");
const kb=D.meta.ko?'<details class="kb"><summary><b>Kontakte</b></summary><div class="bd"><p>'+esc(D.meta.ko)+'</p></div></details>':"";
const cnt=ST.map(s=>D.items.filter(i=>i.status===s).length),nw=D.items.filter(i=>i.wichtig&&i.status!=="Erledigt").length;
const sum=D.items.length?cnt[0]+" offen · "+cnt[1]+" in Klärung · "+cnt[2]+" Info · "+cnt[3]+" erledigt"+(nw?" · davon "+nw+" wichtig und nicht erledigt":""):"";
const rs=(a,b)=>ST.indexOf(a.status)-ST.indexOf(b.status)||(b.wichtig?1:0)-(a.wichtig?1:0)||b.datum.localeCompare(a.datum);
const so=f.so||"st",rk=so==="alt"?(a,b)=>a.datum.localeCompare(b.datum):so==="neu"?(a,b)=>b.datum.localeCompare(a.datum):rs;
const t=(f.t||"").toLowerCase();
const card=(i,n)=>'<details class="it'+(i.wichtig?" imp":"")+'"'+((f.open||(f.openImp&&i.wichtig&&i.status!=="Erledigt"))?" open":"")+' style="--i:'+Math.min(n,8)+'"><summary><span class="c s'+ST.indexOf(i.status)+'">'+esc(i.status)+'</span><span class="wi">'+(i.wichtig?"Wichtig":"")+'</span><span class="d">'+fd(i.datum)+'</span><b class="t">'+esc(i.titel)+'</b></summary><div class="bd">'+(i.details?'<p>'+esc(i.details)+'</p>':"")+(i.kontakt?'<p>Kontakt: '+esc(i.kontakt)+'</p>':"")+(!i.details&&!i.kontakt?'<p class="d">Keine weiteren Details.</p>':"")+'</div></details>';
const v=D.items.filter(i=>(!f.fw||i.wichtig)&&(!f.fs||!f.fs.length||f.fs.includes(i.status))&&(!f.von||i.datum>=f.von)&&(!f.bis||i.datum<=f.bis)&&(!t||[i.titel,i.details,i.kontakt,fd(i.datum),i.status].join(" ").toLowerCase().includes(t))).sort(rk);
const act=v.filter(i=>i.status!=="Erledigt"),imp=act.filter(i=>i.wichtig),rest=act.filter(i=>!i.wichtig),done=v.filter(i=>i.status==="Erledigt");
const sec=(h,a)=>a.length?"<h2>"+h+"</h2>"+a.map(card).join(""):"";
const body=!v.length?'<p class="empty">'+(D.items.length?"Keine Einträge gefunden.":"Keine Einträge vorhanden.")+'</p>':so==="st"?sec("Das Wichtigste",imp)+sec("Offen, in Klärung und Info",rest)+sec("Erledigt",done):sec(so==="alt"?"Chronologisch, älteste zuerst":"Chronologisch, neueste zuerst",v);
return{title:esc((D.meta.ti||"").trim()||"Rückkehr-Übersicht"),head:head,kb:kb,sum:sum,foot:esc(D.meta.br||""),cn:v.length+" von "+D.items.length+" Einträgen",list:body}}
function viewer(D){
const $=s=>document.querySelector(s),ST=["Offen","In Klärung","Info","Erledigt"];let open=false,fw=false,fs=[];
const n=k=>D.items.filter(i=>i.status===k).length;
$("#fb").innerHTML='<button type="button" class="w" data-w="1" aria-pressed="false">Wichtig <span>'+D.items.filter(i=>i.wichtig).length+'</span></button>'+ST.map(s=>'<button type="button" data-s="'+s+'" aria-pressed="false">'+s+' <span>'+n(s)+'</span></button>').join("");
function draw(){const r=ivHtml(D,{t:$("#q").value.trim(),fw:fw,fs:fs,so:$("#so").value,von:$("#dv").value,bis:$("#db").value,open:open});
$("#ls").innerHTML=r.list;$("#cn").textContent=r.cn;$("#ex").textContent=open?"Alle zuklappen":"Alle aufklappen"}
$("#fb").onclick=e=>{const b=e.target.closest("button");if(!b)return;const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on?"true":"false");if(b.dataset.w)fw=on;else fs=on?fs.concat(b.dataset.s):fs.filter(x=>x!==b.dataset.s);draw()};
["#q","#dv","#db"].forEach(s=>$(s).oninput=draw);
$("#so").onchange=draw;$("#dv").onchange=$("#db").onchange=draw;
const z=$("#fz");z.max=Math.min(32,Math.max(24,Math.floor(innerWidth/40)));
z.value=Math.round(parseFloat(getComputedStyle(document.documentElement).fontSize));z.oninput=e=>{document.documentElement.style.fontSize=e.target.value+"px"};
$("#th").checked=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches;
$("#th").onchange=e=>{document.documentElement.dataset.theme=e.target.checked?"dark":"light"};
$("#ex").onclick=()=>{open=!open;document.querySelectorAll("#ls details").forEach(d=>d.open=open);$("#ex").textContent=open?"Alle zuklappen":"Alle aufklappen"};
function pre(){fw=false;fs=[];open=false;document.querySelectorAll("#fb button").forEach(b=>b.setAttribute("aria-pressed","false"));if(D.items.some(i=>i.wichtig)){fw=true;open=true;$("#fb [data-w]").setAttribute("aria-pressed","true")}draw()}
$("#rs").onclick=()=>{$("#q").value="";$("#so").value="st";$("#dv").value=$("#db").value="";pre()};
window.onbeforeprint=()=>document.querySelectorAll("details").forEach(d=>d.open=true);
pre();
}
function ivDoc(ia){const r=ivHtml(S,{fs:[],openImp:true}),D=JSON.stringify({meta:S.meta,items:S.items}).replace(/</g,"\\u003c");
return `<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${r.title}</title><style>${IVCSS}</style></head><body>${ivBody(r,ia)}`+(ia?`<script>document.documentElement.className="js";const ivHtml=${ivHtml.toString()};(${viewer.toString()})(${D})<\/script>`:"")+`</body></html>`}
$("#bh").onclick=()=>out(`Rueckkehr-Uebersicht-statisch-${today()}.html`,ivDoc(false),"text/html");
$("#bi").onclick=()=>out(`Rueckkehr-Uebersicht-interaktiv-${today()}.html`,ivDoc(true),"text/html");
$("#bp").onclick=()=>out(`Rueckkehr-Uebersicht-${today()}.pdf`,pdf(),"application/pdf");
$("#bm").onclick=async e=>{const t=rep().md,b=e.target;try{await navigator.clipboard.writeText(t)}catch(x){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(y){}a.remove()}
b.textContent="Kopiert";setTimeout(()=>b.textContent="Als Markdown kopieren",1600)};
$("#bb").onclick=async()=>{await out(`Rueckkehr-Backup-${today()}.json`,JSON.stringify(S,null,1),"application/json");S.meta.bk=today();save();render()};
$("#bl").onclick=()=>$("#imp").click();
$("#imp").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
try{const j=JSON.parse(await f.text());if(!Array.isArray(j.items))throw 0;
if(!confirm(`Aktuelle Liste durch das Backup ersetzen (${j.items.length} Einträge)?`))return;
S={meta:Object.assign({zt:"",vt:"",ei:"",ko:"",br:"",ti:"",so:"st",bk:""},j.meta),items:j.items};S.items.forEach(i=>{if(!ST.includes(i.status))i.status="Info";if(i.datum==null)i.datum=""});save();fill();render()}catch(x){alert("Diese Datei ist kein gültiges Backup.")}};
render();
</script>
</body>
</html>
